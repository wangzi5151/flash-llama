org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# 注意：不要把 android.aapt2FromMavenOverride 写死在这里。它是 Termux
# 本地路径，写进仓库会让 GitHub 托管 CI（没有这个路径）必然失败。
# Termux 构建时请写到 ~/.gradle/gradle.properties，或在 gradlew 命令行
# 用 -Pandroid.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2 传入。
